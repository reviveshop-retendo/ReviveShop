# Theme Shop Revival — DNS overrides for the 3 Theme Shop hostnames.
# This box already runs dnsmasq as the LAN resolver, so use THIS instead of dns/run.sh.
#
# Install:
#   sudo cp dns/dnsmasq-theme-shop.conf /etc/dnsmasq.d/04-themeshop.conf
#   sudo systemctl restart dnsmasq
#
# Debug — see every query the 3DS makes (identifies hosts we still need to hijack):
#   add:  log-queries
#   then: sudo journalctl -u dnsmasq -f

address=/npdl.cdn.nintendowifi.net/192.168.4.34
address=/npfl.c.app.nintendowifi.net/192.168.4.34
address=/nppl.c.app.nintendowifi.net/192.168.4.34

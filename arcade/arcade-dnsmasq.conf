# ReviveShop Badge Arcade + eShop DNS override (LAN box at 192.168.4.34).
# Replaces /etc/dnsmasq.d/03-reviveshop.conf
#
#   sudo cp arcade-dnsmasq.conf /etc/dnsmasq.d/03-reviveshop.conf
#   sudo systemctl restart dnsmasq
#
# NASC                              -> 3DS gets locator 192.168.4.34:59400 (our NEX auth)
# preputh.bauth.*                   -> Badge Arcade auth hardcode fallback
# ecs/ninja/npdl/etc (eShop)        -> this box's Shopdeck servers
bind-interfaces
listen-address=192.168.4.34
no-resolv
server=127.0.0.53

address=/nasc.pretendo.cc/192.168.4.34
address=/nasc.nintendowifi.net/192.168.4.34
address=/preputh.bauth.pretendo.cc/192.168.4.34
address=/preputh.bauth.nintendowifi.net/192.168.4.34

address=/ecs.c.shop.nintendowifi.net/192.168.4.34
address=/ninja.ctr.shop.nintendo.net/192.168.4.34
address=/ninja.ctr.shop.pretendo.cc/192.168.4.34
address=/ecs.c.shop.pretendo.cc/192.168.4.34
address=/nus.c.shop.pretendo.cc/192.168.4.34
# nus/ias/cas are advertised to the console by ECS GetAccountStatus. Without
# these they resolve to dead real-Nintendo IPs (198.62.122.x) and the purchase
# flow stalls before prepurchase_info. See templates/ecs/getAccountStatus.xml.
address=/nus.c.shop.nintendowifi.net/192.168.4.34
address=/ias.c.shop.nintendowifi.net/192.168.4.34
address=/cas.c.shop.nintendowifi.net/192.168.4.34
# nicoch.net / nicochristmann.net are the hostnames the custom CA/SSL patch
# makes the console ask for; without these they resolve off-box (107.173.31.124).
address=/ecs.c.shop.nicoch.net/192.168.4.34
address=/ninja.ctr.shop.nicoch.net/192.168.4.34
address=/nus.c.shop.nicoch.net/192.168.4.34
address=/ias.c.shop.nicoch.net/192.168.4.34
address=/nasc.nicochristmann.net/192.168.4.34
address=/act.nicochristmann.net/192.168.4.34
address=/service.spr.app.nicoch.net/192.168.4.34
address=/nppl.c.app.nicoch.net/192.168.4.34
address=/ctr-o2fgs.cdn.nicoch.net/192.168.4.34
address=/l-npns.app.pretendo.cc/192.168.4.34
address=/npdl.c.app.nintendowifi.net/192.168.4.34
address=/npdl.cdn.pretendo.cc/192.168.4.34

# Log every query the 3DS makes so we can spot Nico-specific hostnames
log-queries
log-facility=/tmp/arcade-dnsmasq.log
address=/api.example.com/192.168.4.34
address=/soap.example.com/192.168.4.34
# Theme Shop Revival — DNS overrides for the 3 Theme Shop hostnames.
# This box already runs dnsmasq as the LAN resolver, so use THIS instead of dns/run.sh.
#
# Install:
#   sudo cp dns/dnsmasq-theme-shop.conf /etc/dnsmasq.d/04-themeshop.conf
#   sudo systemctl restart dnsmasq
#
# Debug — see every query the 3DS makes (identifies hosts we still need to hijack):
#   add:  log-queries
#   then: sudo journalctl -u dnsmasq -f

address=/npdl.cdn.nintendowifi.net/192.168.4.34
address=/npfl.c.app.nintendowifi.net/192.168.4.34
address=/nppl.c.app.nintendowifi.net/192.168.4.34

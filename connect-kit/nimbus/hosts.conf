# ReviveShop http:C redirect table.
#
# RS_HOST is the LAN address of the ReviveShop box that the 3DS connects to.
# Each mapping is: <nintendo-host> <port>
# The replacement emitted for the console is "RS_HOST:PORT", e.g.
#   ecs.c.shop.nintendowifi.net -> 192.168.4.34:8000
#
# Ports (must match the running ReviveShop services):
#   8000  Flask  ECS/IAS/CAS SOAP + CDN + BOSS content + NASC stub
#   9000  Django Ninja metadata + Samurai web
#   59400 Badge Arcade NEX auth
RS_HOST 192.168.4.34

ecs.c.shop.nintendowifi.net        8000
ninja.ctr.shop.nintendo.net        9000
ninja.ctr.shop.pretendo.cc         9000
ecs.c.shop.pretendo.cc             8000
nus.c.shop.pretendo.cc             8000
npdl.c.app.nintendowifi.net        8000
npdl.cdn.nintendowifi.net          8000
npdi.cdn.nintendowifi.net          8000
npfl.c.app.nintendowifi.net        8000
nppl.c.app.nintendowifi.net        8000
nppl.cdn.nintendowifi.net          8000
nasc.nintendowifi.net              8000
nasc.pretendo.cc                   8000
preputh.bauth.nintendowifi.net     8000
